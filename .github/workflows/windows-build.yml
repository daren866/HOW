name: Build & Release (runtime + renderer integrated)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows 宿主 + 兼容层自测门禁 ----------
  build-x64:
    name: HOW x64 + selftest (MinGW64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make

      - name: Build (x64)
        shell: msys2 {0}
        run: make -f scripts/Makefile.mingw CC=gcc HOW=HOW.exe

      - name: Selftest 兼容层运行验证（门禁）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\HOW.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          Get-ChildItem -Filter selftest-report.txt -ErrorAction SilentlyContinue | Format-List FullName,Length
          if (Test-Path selftest-report.txt) { Get-Content selftest-report.txt }
          else { Write-Host "!! selftest-report.txt 未生成"; Get-ChildItem | Format-Table Name }
          exit $p.ExitCode

      - name: Package zip
        shell: pwsh
        run: |
          $out = "HOW-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item HOW.exe $out\
          Copy-Item samples\MyFirstDemo.hap $out\
          Copy-Item README.md,LICENSE $out\
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
          Get-ChildItem $out.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: HOW-windows-x64.zip

  build-xp:
    name: HOW XP 兼容 + selftest (MinGW32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc make

      - name: Build (PE32, subsystem 5.01)
        shell: msys2 {0}
        run: make -f scripts/Makefile.mingw XP=1 CC=gcc HOW=HOW-xp.exe

      - name: Selftest 兼容层运行验证（门禁）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\HOW-xp.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          if (Test-Path selftest-report.txt) { Get-Content selftest-report.txt }
          else { Write-Host "!! selftest-report.txt 未生成" }
          exit $p.ExitCode

      - name: Package zip (XP)
        shell: pwsh
        run: |
          $out = "HOW-windows-xp"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item HOW-xp.exe $out\HOW.exe
          Copy-Item samples\MyFirstDemo.hap $out\
          Copy-Item README.md,LICENSE $out\
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
          Get-ChildItem $out.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-xp
          path: HOW-windows-xp.zip

  # ---------- HOW Runtime 核心逻辑（Linux 编译 + 单测） ----------
  how-core-linux:
    name: HOW Runtime core tests (Ubuntu x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build core test
        run: |
          gcc -O1 -Isrc -Ithird_party/miniz -o test_core scripts/test_core.c \
            src/json.c src/abc.c \
            third_party/miniz/miniz.c third_party/miniz/miniz_tdef.c \
            third_party/miniz/miniz_tinfl.c third_party/miniz/miniz_zip.c

      - name: Generate sample HAP
        run: python3 tools/make_sample_hap.py

      - name: Run tests
        run: ./test_core | tee core-test.log

      - uses: actions/upload-artifact@v4
        with:
          name: how-core-ubuntu
          path: |
            test_core
            core-test.log
            samples/MyFirstDemo.hap

  # ---------- 上游真实 Ark 运行时编译尝试（Ubuntu x64） ----------
  ark-runtime:
    name: Upstream Ark runtime (Ubuntu x64)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang llvm python3

      - name: Clone upstream repos
        run: |
          # runtime_core 用 v4.1-Release：该版本保留可用的独立 CMake 构建（master 已转向 GN）
          git clone --depth 1 --branch OpenHarmony-v4.1-Release https://github.com/OpenHarmony/arkcompiler_runtime_core.git
          git clone --depth 1 https://github.com/OpenHarmony/arkcompiler_ets_runtime.git

      - name: Pre-fetch third-party deps (manifest driven)
        run: |
          cd arkcompiler_runtime_core
          # 自适应布局：v4.1 独立构建在 static_core/（第三方放 static_core/third_party）
          if [ -f static_core/CMakeLists.txt ]; then
            CORE_DIR=static_core; DEST=static_core/third_party
          else
            CORE_DIR=.; DEST=ark-third-party
          fi
          echo "layout: $CORE_DIR -> $DEST" | tee deps-layout.txt
          mkdir -p "$DEST"
          MANIFEST=scripts/third-party-lists/public
          [ -f "$MANIFEST" ] || MANIFEST=$CORE_DIR/scripts/third-party-lists/public
          while IFS=, read -r name repo ctype cid pmode smode; do
            case "$name" in ''|\#*) continue;; esac
            name=$(echo "$name" | xargs)
            [ -z "$name" ] && continue
            [ -d "$DEST/$name/.git" ] && continue
            # git.linaro.org 不稳定，换 GitHub 官方镜像
            case "$repo" in *git.linaro.org*) repo="https://github.com/Linaro/vixl.git";; esac
            echo "== $name <- $repo ($ctype $cid)"
            case "$ctype" in
              branch|tag)
                git clone -q --depth 1 --branch "$cid" "$repo" "$DEST/$name" || echo "clone $name FAILED"
                ;;
              commit)
                git init -q "$DEST/$name"
                git -C "$DEST/$name" fetch -q --depth 1 "$repo" "$cid" || echo "fetch $name FAILED"
                git -C "$DEST/$name" checkout -q FETCH_HEAD || true
                ;;
            esac
          done < "$MANIFEST"
          ls "$DEST"

      - name: Build arkcompiler_runtime_core (CMake)
        run: |
          cd arkcompiler_runtime_core
          if [ -f static_core/CMakeLists.txt ]; then
            CORE_DIR=static_core
          else
            CORE_DIR=.
          fi
          (cmake -S "$CORE_DIR" -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DPANDA_ENABLE_CLANG_TIDY=false -DPANDA_ENABLE_TESTS=false \
            && cmake --build build -j"$(nproc)") 2>&1 | tee ../log-core.txt || true
          tail -25 ../log-core.txt || true

      - name: Build arkcompiler_ets_runtime (OHOS build system attempt)
        run: |
          cd arkcompiler_ets_runtime
          ls -la | tee ../log-ets-tree.txt
          if [ ! -f build.sh ]; then
            echo "== ets_runtime 独立构建需完整 OpenHarmony 源码树，尝试 group 过滤的 repo sync ==" | tee ../log-ets.txt
            sudo apt-get install -y repo || true
            mkdir -p ../ohos && cd ../ohos
            (repo init -u https://gitee.com/openharmony/manifest.git -b master --depth 1 -g default,arkcompiler 2>&1 || true) | tee -a ../HOW/log-ets.txt
            (repo sync -c -j4 --no-tags 2>&1 || true) | tee -a ../HOW/log-ets.txt
            ls | tee -a ../HOW/log-ets.txt || true
            if [ -f build.sh ]; then
              echo "== prebuilts_download ==" | tee -a ../HOW/log-ets.txt
              (bash build/prebuilts_download.sh 2>&1 || true) | tee -a ../HOW/log-ets.txt
              echo "== build.sh ark_js_host_linux_tools_packages ==" | tee -a ../HOW/log-ets.txt
              (bash build.sh --product-name hispark_taurus_standard --build-target ark_js_host_linux_tools_packages 2>&1 || true) | tee -a ../HOW/log-ets.txt
              find out -name 'ark_js_vm' -o -name '*.abc' 2>/dev/null | head -10 | tee -a ../HOW/log-ets.txt || true
            else
              echo "repo sync 后仍无 build.sh" | tee -a ../HOW/log-ets.txt
            fi
          fi
          tail -20 ../HOW/log-ets.txt 2>/dev/null || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out/bin out/log
          find arkcompiler_runtime_core -type f -executable \
            \( -name 'ark_*' -o -name 'pandasm' -o -name 'paoc' -o -name 'verifier' \
               -o -name 'libark*' \) -size -300M 2>/dev/null \
            | grep -v '\.cpp$' | head -40 | while read -r f; do
              cp "$f" out/bin/ 2>/dev/null || true
            done
          cp arkcompiler_runtime_core/deps-layout.txt out/log/ 2>/dev/null || true
          cp log-*.txt out/log/ 2>/dev/null || true
          echo "binaries:"; ls -la out/bin | head -20
          echo "logs:"; ls -la out/log

      - uses: actions/upload-artifact@v4
        with:
          name: ark-runtime-ubuntu
          path: out/
          if-no-files-found: ignore

  # ---------- 真实渲染器（Skia，Rosen 同源后端）编译（Ubuntu x64） ----------
  renderer-skia:
    name: Skia renderer (Ubuntu x64)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 curl zip

      - name: Clone Skia
        run: git clone --depth 1 https://github.com/google/skia.git

      - name: Sync dependencies
        run: cd skia && python3 tools/git-sync-deps

      - name: Generate & build libskia
        run: |
          cd skia
          export PATH="$PWD/bin:$PATH"
          gn gen out/min --args='is_official_build=false skia_use_expat=false skia_use_fontconfig=false skia_use_freetype=false skia_use_harfbuzz=false skia_use_icu=false skia_use_libjpeg_turbo=false skia_use_libpng=false skia_use_libwebp=false skia_use_zlib=false skia_use_dng_sdk=false skia_use_piex=false skia_enable_pdf=false skia_enable_skottie=false skia_enable_tools=false skia_use_gl=false skia_use_vulkan=false skia_enable_ganesh=false' 2>&1 | tee gen.log
          ninja -C out/min skia 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out/lib out/log
          cp skia/out/min/libskia.a out/lib/ 2>/dev/null || true
          (cd skia && git rev-parse HEAD > ../out/log/skia-revision.txt) 2>/dev/null || true
          cp skia/gen.log skia/build.log out/log/ 2>/dev/null || true
          ls -la out/lib out/log || true

      - uses: actions/upload-artifact@v4
        with:
          name: skia-ubuntu
          path: out/
          if-no-files-found: ignore

  # ---------- Release：整合运行时与渲染器产物 ----------
  release:
    name: Release integrate (runtime + renderer bundles)
    runs-on: ubuntu-latest
    needs: [build-x64, build-xp, how-core-linux, ark-runtime, renderer-skia]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Assemble bundles
        run: |
          set -e
          echo "== downloaded artifacts =="
          find art -maxdepth 2 -type f | head -40

          # 1) Windows 宿主 zip（已含自测门禁）
          cp "art/win-x64/HOW-windows-x64.zip" .
          cp "art/win-xp/HOW-windows-xp.zip" .

          # 2) Ark 运行时 bundle（上游真实编译产物 + HOW 核心单测）
          mkdir -p bundle-ark/ark-runtime bundle-ark/how-core
          cp -r art/ark-runtime-ubuntu/. bundle-ark/ark-runtime/ 2>/dev/null || true
          cp -r art/how-core-ubuntu/.      bundle-ark/how-core/ 2>/dev/null || true
          {
            echo "# HOW Ark Runtime bundle (Ubuntu x64)"
            echo ""
            echo "- ark-runtime/: 上游 arkcompiler_runtime_core / arkcompiler_ets_runtime 编译尝试产物与日志"
            echo "- how-core/: HOW Runtime 核心单测（Linux x64）与样例 HAP"
          } > bundle-ark/README-BUNDLE.md
          (cd bundle-ark && zip -qr ../HOW-ark-runtime-ubuntu-x64.zip .)

          # 3) 渲染器 bundle（Skia 静态库）
          mkdir -p bundle-skia
          cp -r art/skia-ubuntu/. bundle-skia/ 2>/dev/null || true
          {
            echo "# HOW Skia renderer bundle (Ubuntu x64)"
            echo ""
            echo "- libskia.a: 上游 Skia（OpenHarmony Rosen 同源渲染后端）静态库"
            echo "- log/: 构建日志与源码版本"
          } > bundle-skia/README-BUNDLE.md
          (cd bundle-skia && zip -qr ../HOW-skia-renderer-ubuntu-x64.zip .)

          ls -la *.zip

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HOW-windows-x64.zip
            HOW-windows-xp.zip
            HOW-ark-runtime-ubuntu-x64.zip
            HOW-skia-renderer-ubuntu-x64.zip
          generate_release_notes: true
