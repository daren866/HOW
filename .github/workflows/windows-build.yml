name: Build & Release (runtime + renderer integrated)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows 宿主 + 兼容层自测门禁 ----------
  build-x64:
    name: HOW x64 + selftest (MinGW64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make

      - name: Build (x64)
        shell: msys2 {0}
        run: make -f scripts/Makefile.mingw CC=gcc HOW=HOW.exe

      - name: Selftest 兼容层运行验证（门禁）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\HOW.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          Get-ChildItem -Filter selftest-report.txt -ErrorAction SilentlyContinue | Format-List FullName,Length
          if (Test-Path selftest-report.txt) { Get-Content selftest-report.txt }
          else { Write-Host "!! selftest-report.txt 未生成"; Get-ChildItem | Format-Table Name }
          exit $p.ExitCode

      - name: Package zip
        shell: pwsh
        run: |
          $out = "HOW-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item HOW.exe $out\
          Copy-Item samples\MyFirstDemo.hap $out\
          Copy-Item README.md,LICENSE $out\
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
          Get-ChildItem $out.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: HOW-windows-x64.zip

  build-xp:
    name: HOW XP 兼容 + selftest (MinGW32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc make

      - name: Build (PE32, subsystem 5.01)
        shell: msys2 {0}
        run: make -f scripts/Makefile.mingw XP=1 CC=gcc HOW=HOW-xp.exe

      - name: Selftest 兼容层运行验证（门禁）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\HOW-xp.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          if (Test-Path selftest-report.txt) { Get-Content selftest-report.txt }
          else { Write-Host "!! selftest-report.txt 未生成" }
          exit $p.ExitCode

      - name: Package zip (XP)
        shell: pwsh
        run: |
          $out = "HOW-windows-xp"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item HOW-xp.exe $out\HOW.exe
          Copy-Item samples\MyFirstDemo.hap $out\
          Copy-Item README.md,LICENSE $out\
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
          Get-ChildItem $out.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-xp
          path: HOW-windows-xp.zip

  # ---------- HOW Runtime 核心逻辑（Linux 编译 + 单测） ----------
  how-core-linux:
    name: HOW Runtime core tests (Ubuntu x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build core test
        run: |
          gcc -O1 -Isrc -Ithird_party/miniz -o test_core scripts/test_core.c \
            src/json.c src/abc.c \
            third_party/miniz/miniz.c third_party/miniz/miniz_tdef.c \
            third_party/miniz/miniz_tinfl.c third_party/miniz/miniz_zip.c

      - name: Generate sample HAP
        run: python3 tools/make_sample_hap.py

      - name: Run tests
        run: ./test_core | tee core-test.log

      - uses: actions/upload-artifact@v4
        with:
          name: how-core-ubuntu
          path: |
            test_core
            core-test.log
            samples/MyFirstDemo.hap

  # ---------- 上游真实 Ark 运行时编译尝试（Ubuntu x64） ----------
  ark-runtime:
    name: Upstream Ark runtime (Ubuntu x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          # libtinfo5: prebuilts clang 链接依赖（22.04 才有此包）；
          # 其余为 build/tools_checker.py 要求的系统工具（消除 Missing dependencies）
          sudo apt-get install -y cmake ninja-build g++ clang llvm python3 lcov gdb \
            ccache default-jdk libtinfo5 genext2fs u-boot-tools mtools mtd-utils scons \
            gcc-arm-none-eabi ruby

      - name: Clone arkcompiler_runtime_core (v4.1, CMake-able)
        run: |
          # runtime_core 用 v4.1-Release：该版本保留可用的独立 CMake 构建（master 已转向 GN）
          # ets_runtime 不再单独 clone：master 无独立构建入口，改由下一步 repo sync 拉全树
          git clone --depth 1 --branch OpenHarmony-v4.1-Release https://github.com/OpenHarmony/arkcompiler_runtime_core.git

      - name: Pre-fetch third-party deps (manifest driven)
        run: |
          cd arkcompiler_runtime_core
          # 自适应布局：v4.1 独立构建在 static_core/（第三方放 static_core/third_party）
          if [ -f static_core/CMakeLists.txt ]; then
            CORE_DIR=static_core; DEST=static_core/third_party
          else
            CORE_DIR=.; DEST=ark-third-party
          fi
          echo "layout: $CORE_DIR -> $DEST" | tee deps-layout.txt
          mkdir -p "$DEST"
          MANIFEST=scripts/third-party-lists/public
          [ -f "$MANIFEST" ] || MANIFEST=$CORE_DIR/scripts/third-party-lists/public
          while IFS=, read -r name repo ctype cid pmode smode; do
            case "$name" in ''|\#*) continue;; esac
            name=$(echo "$name" | xargs)
            [ -z "$name" ] && continue
            [ -d "$DEST/$name/.git" ] && continue
            # git.linaro.org 不稳定，换 GitHub 官方镜像
            case "$repo" in *git.linaro.org*) repo="https://github.com/Linaro/vixl.git";; esac
            echo "== $name <- $repo ($ctype $cid)"
            case "$ctype" in
              branch|tag)
                git clone -q --depth 1 --branch "$cid" "$repo" "$DEST/$name" || echo "clone $name FAILED"
                ;;
              commit)
                git init -q "$DEST/$name"
                git -C "$DEST/$name" fetch -q --depth 1 "$repo" "$cid" || echo "fetch $name FAILED"
                git -C "$DEST/$name" checkout -q FETCH_HEAD || true
                ;;
            esac
          done < "$MANIFEST"
          ls "$DEST"

      - name: Build arkcompiler_runtime_core (CMake)
        run: |
          cd arkcompiler_runtime_core
          if [ -f static_core/CMakeLists.txt ]; then
            CORE_DIR=static_core
          else
            CORE_DIR=.
          fi
          (cmake -S "$CORE_DIR" -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DPANDA_ENABLE_CLANG_TIDY=false -DPANDA_ENABLE_TESTS=false \
            -DPANDA_ENABLE_COVERAGE=false \
            && cmake --build build -j"$(nproc)") 2>&1 | tee ../log-core.txt || true
          tail -25 ../log-core.txt || true

      - name: Build arkcompiler_ets_runtime (repo sync 依赖子集 + 迷你产品单模块编译)
        run: |
          LOG="$GITHUB_WORKSPACE/log-ets.txt"
          echo "== OHOS repo sync 实验（$(date -u +%FT%TZ)）==" | tee "$LOG"
          # repo 启动器：官方源直连（apt 的 repo 包版本过旧）
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          repo version 2>/dev/null | head -2 | tee -a "$LOG"
          git config --global user.email "ci@how.local"
          git config --global user.name "HOW CI"
          # 实测要点（本地沙箱已验证，commit 019fdc7 前后）：
          #  - manifest 用 GitHub 镜像；master 分支项目 remote 已迁至 gitcode.com
          #  - manifest 无 arkcompiler group，旧 -g default,arkcompiler 写法无效
          #  - 按项目名精确同步（浅克隆）；build 项目 linkfile 在树根生成 build.sh/build.py/.gn
          #  - 只拉需要的模块：核心 + ets_runtime 实际引用的依赖仓库（external_deps 驱动，
          #    名单已逐一在 manifest 验证；cJSON 大写、commonlibrary_c_utils 等易踩坑）
          #  - 不做全量树同步；迷你产品 json 只含 arkcompiler/ets_runtime，
          #    build.sh --build-target 只编译宿主工具子图，符合公开仓库 Actions 资源约束
          mkdir -p ohos && cd ohos
          echo "== repo init（GitHub manifest 镜像，浅克隆）==" | tee -a "$LOG"
          (repo init -u https://github.com/OpenHarmony/manifest.git -b master \
             --manifest-depth=1 --depth=1 \
             --repo-url=https://github.com/GerritCodeReview/git-repo.git \
             --no-clone-bundle 2>&1 || true) | tail -5 | tee -a "$LOG"
          echo "== 按项目名同步（构建链依赖子集，重试 3 次）==" | tee -a "$LOG"
          for i in 1 2 3; do
            repo sync -c -j4 --no-tags \
              build productdefine_common \
              arkcompiler_ets_runtime arkcompiler_ets_frontend arkcompiler_runtime_core \
              commonlibrary_c_utils \
              third_party_icu third_party_zlib third_party_libuv third_party_protobuf \
              third_party_cJSON third_party_json third_party_bounds_checking_function \
              third_party_abseil-cpp third_party_googletest third_party_pcre2 \
              third_party_flatbuffers global_i18n hiviewdfx_hilog \
              resourceschedule_qos_manager testfwk_developer_test \
              developtools_integration_verification \
              > sync-detail.log 2>&1
            rc=$?
            tail -8 sync-detail.log | tee -a "$LOG"
            if [ $rc -eq 0 ] && [ -d arkcompiler/ets_runtime ] && [ -d build ]; then
              echo "第 $i 次同步成功（rc=0）" | tee -a "$LOG"; break
            fi
            echo "第 $i 次同步不完整（rc=$rc），重试…" | tee -a "$LOG"
          done
          echo "== 同步结果 ==" | tee -a "$LOG"
          (repo list 2>/dev/null || true) | tee -a "$LOG"
          (du -sh arkcompiler/* build productdefine third_party/* 2>/dev/null || true) | tee -a "$LOG"
          (ls -la build.sh build.py .gn 2>/dev/null || true) | tee -a "$LOG"
          # 迷你产品：只含 arkcompiler/ets_runtime —— 官方机制下"只编译需要的模块"
          python3 -c "import json,os; os.makedirs('productdefine/common/products', exist_ok=True); json.dump({'product_name':'how_ark_mini','device_company':'ohos','board':'x86_64','target_cpu':'x86_64','type':'standard','version':'3.0','compile_mode':'host','subsystems':[{'subsystem':'arkcompiler','components':[{'component':'ets_runtime','features':[]}]}]}, open('productdefine/common/products/how_ark_mini.json','w'), indent=2)"
          echo "== how_ark_mini.json 已写入 ==" | tee -a "$LOG"
          # 组件白名单：hb _cropping_components 只保留 src 部件 + 白名单组件，
          # libuv/protobuf/abseil-cpp 等不在内置表 → 用 out/products_ext 官方覆盖钩子补全
          python3 -c "
          import json, os, glob
          base = json.load(open('build/third_party_allow_list.json'))
          try: auto = json.load(open('build/auto_install_whitelist.json'))
          except Exception: auto = []
          extra = ['ets_runtime','ets_frontend','runtime_core','c_utils','hilog','i18n','qos_manager','build_framework']
          for f in glob.glob('third_party/*/bundle.json') + glob.glob('*/*/bundle.json'):
              try: extra.append(json.load(open(f))['component']['name'])
              except Exception: pass
          merged = sorted(set(base) | set(auto) | set(extra))
          os.makedirs('out/products_ext', exist_ok=True)
          json.dump(merged, open('out/products_ext/third_party_allow_list.json','w'), indent=2)
          print('products_ext allow list:', len(merged))"
          echo "== products_ext 白名单已写 ==" | tee -a "$LOG"
          if [ -f build.sh ]; then
            echo "== prebuilts_download（官方工具链，build.sh 硬依赖，重试 3 次）==" | tee -a "$LOG"
            # npm registry 预设为华为云镜像（上一轮 npm install 默认源抖动失败）
            npm config set registry https://repo.huaweicloud.com/repository/npm/ || true
            for i in 1 2 3; do
              (timeout 2400 bash build/prebuilts_download.sh 2>&1 || true) | tail -6 | tee -a "$LOG"
              # build.sh 硬依赖 prebuilts/python 与 build-tools，以此判成功
              if ls prebuilts/python/linux-x86/*/bin/python3 >/dev/null 2>&1 \
                 && [ -d prebuilts/build-tools ]; then
                echo "prebuilts 就绪（第 $i 次）" | tee -a "$LOG"; break
              fi
            done
            # hb 需要 jinja2/yaml（prebuilts python 自带 pip）
            PY3=$(ls prebuilts/python/linux-x86/*/bin/python3 2>/dev/null | tail -1)
            if [ -n "$PY3" ]; then
              ("$PY3" -m pip install jinja2 pyyaml 2>&1 || true) | tail -3 | tee -a "$LOG"
            fi
            echo "== build.sh --build-target ark_js_host_linux_tools_packages（只编译宿主工具子图）==" | tee -a "$LOG"
            (timeout 3000 bash build.sh --product-name how_ark_mini \
               --build-target ark_js_host_linux_tools_packages \
               --gn-args is_host_product=true 2>&1 || true) | tail -80 | tee -a "$LOG"
            echo "== 产物搜寻 ==" | tee -a "$LOG"
            (find out -type f \( -name 'ark_js_vm' -o -name 'es2abc' -o -name '*.abc' \) 2>/dev/null | head -10 || true) | tee -a "$LOG"
          else
            echo "!! repo sync 后仍无根 build.sh（linkfile 未生成）" | tee -a "$LOG"
          fi

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out/bin out/log
          find arkcompiler_runtime_core -type f -executable \
            \( -name 'ark_*' -o -name 'pandasm' -o -name 'paoc' -o -name 'verifier' \
               -o -name 'libark*' \) -size -300M 2>/dev/null \
            | grep -v '\.cpp$' | head -40 | while read -r f; do
              cp "$f" out/bin/ 2>/dev/null || true
            done
          # repo sync 迷你产品编译产物：宿主工具 + 全部运行时依赖 so（含 libhmicui18n 等）
          find ohos/out/host -type f -executable \
            \( -name '*.so' -o -name '*.so.*' -o -name 'ark_*' -o -name 'profdump' \
               -o -name 'quick_fix' \) -size -200M 2>/dev/null \
            | grep -v '/gen/' | grep -v '/obj/' | head -40 | while read -r f; do
              cp "$f" out/bin/ 2>/dev/null || true
            done
          cp arkcompiler_runtime_core/deps-layout.txt out/log/ 2>/dev/null || true
          cp log-*.txt out/log/ 2>/dev/null || true
          cp ohos/sync-detail.log out/log/ 2>/dev/null || true
          echo "binaries:"; ls -la out/bin | head -20
          echo "logs:"; ls -la out/log

      - uses: actions/upload-artifact@v4
        with:
          name: ark-runtime-ubuntu
          path: out/
          if-no-files-found: ignore

  # ---------- 真 Ark 运行时 Windows 原生编译尝试（x64） ----------
  # runtime_core v4.1 保留官方 Windows host 支持路径（libpandabase/os/windows），
  # 编译成功则产出 ark_js_vm 等原生工具，随 Release zip 的 ark/windows/ 注入，
  # HOW.exe 兼容层可直接 CreateProcess 真实执行 modules.abc。
  # 上游工程量大、工具链差异多，设为尽力而为（continue-on-error）。
  ark-runtime-windows:
    name: Upstream Ark runtime (Windows x64 native)
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Clone arkcompiler_runtime_core (v4.1, CMake-able)
        shell: bash
        run: |
          git clone --depth 1 --branch OpenHarmony-v4.1-Release \
            https://github.com/OpenHarmony/arkcompiler_runtime_core.git

      - name: Pre-fetch third-party deps (manifest driven)
        shell: bash
        run: |
          cd arkcompiler_runtime_core
          if [ -f static_core/CMakeLists.txt ]; then
            CORE_DIR=static_core; DEST=static_core/third_party
          else
            CORE_DIR=.; DEST=ark-third-party
          fi
          echo "layout: $CORE_DIR -> $DEST" | tee deps-layout.txt
          mkdir -p "$DEST"
          MANIFEST=scripts/third-party-lists/public
          [ -f "$MANIFEST" ] || MANIFEST=$CORE_DIR/scripts/third-party-lists/public
          while IFS=, read -r name repo ctype cid pmode smode; do
            case "$name" in ''|\#*) continue;; esac
            name=$(echo "$name" | xargs)
            [ -z "$name" ] && continue
            [ -d "$DEST/$name/.git" ] && continue
            case "$repo" in *git.linaro.org*) repo="https://github.com/Linaro/vixl.git";; esac
            echo "== $name <- $repo ($ctype $cid)"
            case "$ctype" in
              branch|tag)
                git clone -q --depth 1 --branch "$cid" "$repo" "$DEST/$name" 2>/dev/null || echo "clone $name FAILED"
                ;;
              commit)
                git init -q "$DEST/$name"
                git -C "$DEST/$name" fetch -q --depth 1 "$repo" "$cid" 2>/dev/null || echo "fetch $name FAILED"
                git -C "$DEST/$name" checkout -q FETCH_HEAD || true
                ;;
            esac
          done < "$MANIFEST"
          ls "$DEST" || true

      - name: Build (CMake, MSVC)
        shell: pwsh
        run: |
          cd arkcompiler_runtime_core
          $core = if (Test-Path "static_core/CMakeLists.txt") { "static_core" } else { "." }
          cmake -S $core -B build -DCMAKE_BUILD_TYPE=Release `
            -DPANDA_ENABLE_CLANG_TIDY=OFF -DPANDA_ENABLE_TESTS=OFF `
            -DPANDA_ENABLE_COVERAGE=OFF 2>&1 | Tee-Object -FilePath configure.log | Select-Object -Last 25
          if (-not (Test-Path "build/build.ninja") -and -not (Test-Path "build/HOW.sln") -and -not (Get-ChildItem build -Filter *.sln -ErrorAction SilentlyContinue)) {
            Write-Host "!! configure 失败，中止构建"
            exit 0
          }
          cmake --build build --config Release --parallel 2 2>&1 |
            Tee-Object -FilePath build.log | Select-Object -Last 40

      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/bin, out/log | Out-Null
          if (Test-Path arkcompiler_runtime_core) {
            Get-ChildItem arkcompiler_runtime_core -Recurse -Include *.exe,*.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(ark_|pandasm|verifier|libark|es2panda|paoc)' -and $_.Length -lt 300MB } |
              Select-Object -First 40 | ForEach-Object {
                Copy-Item $_.FullName out/bin/ -Force
                Write-Host "collected: $($_.Name) $([math]::Round($_.Length/1MB,1))MB"
              }
            Copy-Item arkcompiler_runtime_core/deps-layout.txt, arkcompiler_runtime_core/configure.log, arkcompiler_runtime_core/build.log out/log/ -ErrorAction SilentlyContinue
          }
          Get-ChildItem out/bin | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ark-runtime-windows
          path: out/
          if-no-files-found: ignore

  # ---------- 真实渲染器（Skia，Rosen 同源后端）编译（Ubuntu x64） ----------
  renderer-skia:
    name: Skia renderer (Ubuntu x64)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 curl zip

      - name: Clone Skia
        run: git clone --depth 1 https://github.com/google/skia.git

      - name: Sync dependencies
        run: cd skia && python3 tools/git-sync-deps

      - name: Generate & build libskia
        run: |
          cd skia
          export PATH="$PWD/bin:$PATH"
          gn gen out/min --args='is_official_build=false skia_use_expat=false skia_use_fontconfig=false skia_use_freetype=false skia_use_harfbuzz=false skia_use_icu=false skia_use_libjpeg_turbo=false skia_use_libpng=false skia_use_libwebp=false skia_use_zlib=false skia_use_dng_sdk=false skia_use_piex=false skia_enable_pdf=false skia_enable_skottie=false skia_enable_tools=false skia_use_gl=false skia_use_vulkan=false skia_enable_ganesh=false' 2>&1 | tee gen.log
          ninja -C out/min skia 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out/lib out/log
          cp skia/out/min/libskia.a out/lib/ 2>/dev/null || true
          (cd skia && git rev-parse HEAD > ../out/log/skia-revision.txt) 2>/dev/null || true
          cp skia/gen.log skia/build.log out/log/ 2>/dev/null || true
          ls -la out/lib out/log || true

      - uses: actions/upload-artifact@v4
        with:
          name: skia-ubuntu
          path: out/
          if-no-files-found: ignore

  # ---------- Release：整合运行时与渲染器产物 ----------
  release:
    name: Release integrate (runtime + renderer bundles)
    runs-on: ubuntu-latest
    needs: [build-x64, build-xp, how-core-linux, ark-runtime, ark-runtime-windows, renderer-skia]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Assemble bundles
        run: |
          set -e
          echo "== downloaded artifacts =="
          find art -maxdepth 2 -type f | head -40

          # 1) Windows 宿主 zip（已含自测门禁）+ 注入真 Ark 运行时组件
          cp "art/win-x64/HOW-windows-x64.zip" .
          cp "art/win-xp/HOW-windows-xp.zip" .

          # 1.5) 真 Ark 运行时注入：兼容层窗口启动时自动探测 ark/ 并真实执行 modules.abc
          mkdir -p inject/ark/linux inject/ark/windows
          cp art/ark-runtime-ubuntu/bin/* inject/ark/linux/   2>/dev/null || true
          cp art/ark-runtime-windows/bin/* inject/ark/windows/ 2>/dev/null || true
          # 控制体积：单文件 >120MB 丢弃
          find inject/ark -type f -size +120M -delete 2>/dev/null || true
          {
            echo "真 Ark 运行时组件（上游 arkcompiler 真编译产物，CI 自动构建）"
            echo "==============================================================="
            echo "- windows/: Windows 原生 ark_js_vm 等工具（ark-runtime-windows job 产物）"
            echo "- linux/:   Linux 版 ark_js_vm / libark_jsruntime.so 等（ark-runtime job 产物，"
            echo "            兼容层在装有 WSL 的机器上自动经 wsl.exe 调用）"
            echo ""
            echo "HOW.exe 兼容层窗口启动时会自动探测本目录："
            echo "  1. ark/windows/ark_js_vm.exe 存在 → 直接 CreateProcess 执行 hap 的 modules.abc"
            echo "  2. ark/linux/ark_js_vm 存在且 WSL 可用 → 经 wsl.exe 执行"
            echo "  3. 均不可用 → 内置 HOWVM 引擎兜底"
            echo "探测与执行结果见兼容层窗口日志面板与工具栏引擎徽标。"
          } > inject/ark/README-ARK.txt
          echo "== 注入清单 =="; du -sh inject/ark/* 2>/dev/null || true
          rm -rf rezip && mkdir rezip
          (cd rezip && unzip -q ../HOW-windows-x64.zip \
             && cp -r ../inject/ark HOW-windows-x64/ \
             && rm -f ../HOW-windows-x64.zip \
             && zip -qr ../HOW-windows-x64.zip HOW-windows-x64)
          echo "== 注入后 zip =="; ls -la HOW-windows-x64.zip

          # 2) Ark 运行时 bundle（上游真实编译产物 + HOW 核心单测）
          mkdir -p bundle-ark/ark-runtime bundle-ark/how-core
          cp -r art/ark-runtime-ubuntu/. bundle-ark/ark-runtime/ 2>/dev/null || true
          cp -r art/how-core-ubuntu/.      bundle-ark/how-core/ 2>/dev/null || true
          {
            echo "# HOW Ark Runtime bundle (Ubuntu x64)"
            echo ""
            echo "- ark-runtime/: 上游 arkcompiler_runtime_core / arkcompiler_ets_runtime 编译尝试产物与日志"
            echo "- how-core/: HOW Runtime 核心单测（Linux x64）与样例 HAP"
          } > bundle-ark/README-BUNDLE.md
          (cd bundle-ark && zip -qr ../HOW-ark-runtime-ubuntu-x64.zip .)

          # 3) 渲染器 bundle（Skia 静态库）
          mkdir -p bundle-skia
          cp -r art/skia-ubuntu/. bundle-skia/ 2>/dev/null || true
          {
            echo "# HOW Skia renderer bundle (Ubuntu x64)"
            echo ""
            echo "- libskia.a: 上游 Skia（OpenHarmony Rosen 同源渲染后端）静态库"
            echo "- log/: 构建日志与源码版本"
          } > bundle-skia/README-BUNDLE.md
          (cd bundle-skia && zip -qr ../HOW-skia-renderer-ubuntu-x64.zip .)

          ls -la *.zip

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HOW-windows-x64.zip
            HOW-windows-xp.zip
            HOW-ark-runtime-ubuntu-x64.zip
            HOW-skia-renderer-ubuntu-x64.zip
          generate_release_notes: true
