name: Ark Runtime (upstream build attempt)

# 尝试构建真实的 OpenHarmony ArkCompiler 运行时（上游仓库）。
# 上游对 Windows 原生构建尚未官方支持，故此工作流：
#   1. 在 Linux x64 上按官方文档尝试 arkcompiler_ets_runtime 独立构建
#   2. 在 Linux x64 上尝试 arkcompiler_runtime_core 的 CMake 构建
# 结果与日志作为制品上传，用于评估 Windows x64 移植的可行性。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC 巡检一次上游构建状态

jobs:
  ets-runtime-x64:
    name: arkcompiler_ets_runtime x64.release
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - name: Clone upstream
        run: |
          git clone --depth 1 https://github.com/OpenHarmony/arkcompiler_ets_runtime.git
          git clone --depth 1 https://github.com/OpenHarmony/arkcompiler_runtime_core.git

      - name: Try official standalone build (ark.py)
        run: |
          cd arkcompiler_ets_runtime
          ls
          (python3 ark.py x64.release || python3 build.py x64.release) 2>&1 | tee build-ets.log || true
          tail -50 build-ets.log

      - name: Try runtime_core CMake build
        run: |
          cd arkcompiler_runtime_core
          (cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2) \
            2>&1 | tee build-core.log || true
          tail -30 build-core.log

      - name: Collect artifacts
        run: |
          mkdir -p art
          cp arkcompiler_ets_runtime/build-ets.log art/ 2>/dev/null || true
          cp arkcompiler_runtime_core/build-core.log art/ 2>/dev/null || true
          find arkcompiler_ets_runtime arkcompiler_runtime_core \
            -maxdepth 3 -name "*.so" -o -maxdepth 3 -name "ark" -o -maxdepth 3 -name "es2abc" \
            2>/dev/null | xargs -I{} cp {} art/ 2>/dev/null || true
          ls -la art || true

      - name: Upload logs & binaries
        uses: actions/upload-artifact@v4
        with:
          name: ark-runtime-build-logs
          path: art/
          if-no-files-found: ignore
